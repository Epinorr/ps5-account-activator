name: EPINOR Combined PS5

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ELF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout payload
        uses: actions/checkout@v4

      - name: Cache PS5 Payload SDK & Vendor
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ps5-payload-sdk
            .vendor
          key: ${{ runner.os }}-ps5-sdk-v0.42-vendor-v1.1

      - name: Checkout PS5 Payload SDK v0.42
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          ref: v0.42
          path: sdk

      - name: Install SDK host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            python3 \
            xxd

      - name: Install PS5 Payload SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          set -euxo pipefail
          make DESTDIR="${{ runner.temp }}/ps5-payload-sdk" clean install

      - name: Validate Project Structure
        run: |
          set -euxo pipefail
          python3 tools/validate_project.py

      - name: Build payload
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/ps5-payload-sdk
        run: |
          set -euxo pipefail
          make clean
          make all

      - name: Verify ELF
        run: |
          set -euxo pipefail
          test -s AIO-Activator.elf
          file AIO-Activator.elf
          readelf -h AIO-Activator.elf

      - name: Generate checksum
        run: |
          set -euxo pipefail
          sha256sum AIO-Activator.elf > SHA256SUMS.txt

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIO-Activator
          if-no-files-found: error
          path: |
            AIO-Activator.elf
            SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: AIO-Activator
          path: dist

      - name: Verify release files
        run: |
          set -euxo pipefail
          test -s dist/AIO-Activator.elf
          test -s dist/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/AIO-Activator.elf
            dist/SHA256SUMS.txt