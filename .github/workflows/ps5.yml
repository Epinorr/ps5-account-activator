name: EPINOR Combined PS5

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ELF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout payload
        uses: actions/checkout@v4

      - name: Checkout PS5 Payload SDK v0.42
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          ref: v0.42
          path: sdk

      - name: Install SDK host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            python3 \
            xxd

      - name: Install PS5 Payload SDK
        working-directory: sdk
        run: |
          set -euxo pipefail

          make DESTDIR="${{ runner.temp }}/ps5-payload-sdk" clean install

          test -f "${{ runner.temp }}/ps5-payload-sdk/toolchain/prospero.mk"
          test -x "${{ runner.temp }}/ps5-payload-sdk/bin/prospero-clang"
          test -x "${{ runner.temp }}/ps5-payload-sdk/bin/prospero-strip"

      - name: Build payload
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/ps5-payload-sdk
        run: |
          set -euxo pipefail

          make clean
          make all

      - name: Verify ELF
        run: |
          set -euxo pipefail

          test -s EPINOR-NP-Fake-Signin.elf
          file EPINOR-NP-Fake-Signin.elf
          readelf -h EPINOR-NP-Fake-Signin.elf

      - name: Generate checksum
        run: |
          set -euxo pipefail

          sha256sum EPINOR-NP-Fake-Signin.elf > SHA256SUMS.txt

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPINOR-NP-Fake-Signin
          if-no-files-found: error
          path: |
            EPINOR-NP-Fake-Signin.elf
            SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: EPINOR-NP-Fake-Signin
          path: dist

      - name: Verify release files
        run: |
          set -euxo pipefail

          test -s dist/EPINOR-NP-Fake-Signin.elf
          test -s dist/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/EPINOR-NP-Fake-Signin.elf
            dist/SHA256SUMS.txt
